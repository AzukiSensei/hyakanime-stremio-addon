<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101116">
<title>AniList — Configuration Stremio</title>
<style>
:root{color-scheme:dark;--bg:#0b0c10;--panel:#14161d;--panel2:#1a1d26;--border:#2a2e3a;--text:#f5f6fa;--muted:#9da4b4;--accent:#7c5cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{width:min(720px,calc(100% - 28px));margin:auto;padding:34px 0 56px}.hero{margin-bottom:24px}h1{font-size:34px;margin:0 0 8px}.muted{color:var(--muted)}.card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:20px;margin-bottom:14px}.field{display:grid;gap:8px;margin:16px 0}select{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:13px}.row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)}.row:last-child{border-bottom:0}.switch{width:48px;height:28px;position:relative}.switch input{display:none}.slider{position:absolute;inset:0;border-radius:999px;background:#343947}.slider:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;border-radius:50%;background:white;transition:.2s}.switch input:checked+.slider{background:var(--accent)}.switch input:checked+.slider:before{transform:translateX(20px)}.actions{display:grid;gap:10px;margin-top:18px}.btn{border:0;border-radius:13px;padding:14px 16px;font:inherit;font-weight:700;text-align:center;text-decoration:none;cursor:pointer}.primary{background:var(--accent);color:white}.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--border)}.url{margin-top:14px;padding:11px;background:#0c0e13;border:1px solid var(--border);border-radius:10px;color:var(--muted);font:11px ui-monospace,monospace;overflow-wrap:anywhere}@media(min-width:600px){.actions{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main>
<section class="hero"><h1>AniList pour Stremio</h1><div class="muted">Catalogue AniList avec métadonnées d’épisodes AniZip.</div></section>
<section class="card">
<div class="field"><label for="titleLanguage">Titre préféré</label><select id="titleLanguage"><option value="auto">Automatique</option><option value="en">Anglais</option><option value="romaji">Romaji</option><option value="jp">Japonais</option></select></div>
<div class="row"><div><strong>Séries</strong><div class="muted">Afficher le catalogue séries.</div></div><label class="switch"><input id="includeSeries" type="checkbox" checked><span class="slider"></span></label></div>
<div class="row"><div><strong>Films</strong><div class="muted">Afficher le catalogue films.</div></div><label class="switch"><input id="includeMovies" type="checkbox" checked><span class="slider"></span></label></div>
<div class="field"><label for="seasonYearsBack">Historique saisonnier</label><select id="seasonYearsBack"><option value="2">2 ans</option><option value="4" selected>4 ans</option><option value="6">6 ans</option><option value="10">10 ans</option></select></div>
<div class="actions"><a id="install" class="btn primary" href="#">Installer dans Stremio</a><button id="copy" class="btn secondary">Copier l’URL</button></div>
<div id="url" class="url"></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
function b64url(str){const bytes=new TextEncoder().encode(str);let b="";for(const x of bytes)b+=String.fromCharCode(x);return btoa(b).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function from64(v){try{const n=v.replace(/-/g,"+").replace(/_/g,"/");const p=n+"=".repeat((4-n.length%4)%4);const bin=atob(p);return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)))}catch{return null}}
function pathConfig(){const m=location.pathname.match(/^\/c\/([^/]+)\/configure\/?$/);if(!m)return null;try{return JSON.parse(from64(m[1]))}catch{return null}}
function current(){return{titleLanguage:$("titleLanguage").value,includeSeries:$("includeSeries").checked,includeMovies:$("includeMovies").checked,seasonYearsBack:Number($("seasonYearsBack").value)}}
function urls(c){const enc=b64url(JSON.stringify(c));const path=`/c/${enc}/manifest.json`;return{https:`${location.origin}${path}`,stremio:`stremio://${location.host}${path}`}}
function apply(c){if(!c)return;if(["auto","en","romaji","jp"].includes(c.titleLanguage))$("titleLanguage").value=c.titleLanguage;if(typeof c.includeSeries==="boolean")$("includeSeries").checked=c.includeSeries;if(typeof c.includeMovies==="boolean")$("includeMovies").checked=c.includeMovies;if(Number.isFinite(Number(c.seasonYearsBack)))$("seasonYearsBack").value=String(c.seasonYearsBack)}
function update(){const u=urls(current());$("url").textContent=u.https;$("install").href=u.stremio}
apply(pathConfig());["titleLanguage","includeSeries","includeMovies","seasonYearsBack"].forEach(id=>$(id).addEventListener("change",update));
$("copy").addEventListener("click",async()=>{await navigator.clipboard.writeText(urls(current()).https);$("copy").textContent="URL copiée";setTimeout(()=>$("copy").textContent="Copier l’URL",1200)});
if(pathConfig())$("install").textContent="Mettre à jour dans Stremio";update();
</script>
</body>
</html>
